<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262b44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VM PANEL">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-180.png">
<meta name="robots" content="noindex, nofollow">
<title>VM//PANEL - login</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/sprite.svg" type="image/svg+xml">
<script src="/static/pwa.js" defer></script>
<script src="/static/login.js" defer></script>
</head>
<body>
<div class="login-wrap">
  <div class="login">
    <img class="sprite" src="/static/sprite.svg" alt="" width="88" height="64">
    <h1 class="title">VM//PANEL</h1>
    <div class="sub">PLAYER 1 &middot; INSERT CREDENTIALS</div>
    <div class="box">
      <h2>LOGIN</h2>
      <form id="f" autocomplete="on">
        <label class="f"><span>Usuario</span><input id="u" name="username" autocomplete="username" required autofocus></label>
        <label class="f"><span>Senha</span><input id="p" name="password" type="password" autocomplete="current-password" required></label>
        <label class="f hidden" id="totp-row"><span>Codigo 2FA</span><input id="t" name="totp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></label>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <button class="btn gold" type="submit" id="go">&#9654; START</button>
      </form>
    </div>
    <div class="press blink">PRESS START</div>
  </div>
</div>
</body>
</html>
