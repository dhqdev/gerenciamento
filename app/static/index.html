<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VM//PANEL</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/sprite.svg" type="image/svg+xml">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="hud">
    <h1 class="logo">VM//PANEL<small id="subtitle">LOADING...</small></h1>
    <div class="chips" id="chips"></div>
    <div class="hud-right">
      <button class="btn" id="btn-refresh" title="Atualizar dados agora (R)">&#8635; DADOS</button>
      <button class="btn gold" id="btn-update" title="Atualizar o painel para a ultima versao">&#9733; ATUALIZAR PAINEL</button>
      <button class="btn danger" id="btn-logout" title="Sair">SAIR</button>
      <div class="clock"><span id="clock">--:--:--</span><small id="uptime">uptime --</small></div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Secoes"></nav>

  <main id="view"></main>
</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <h2 id="modal-title">-</h2>
    <div class="toolbar" id="modal-tools"></div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="overlay" class="hidden">
  <div class="box">
    <h2>ATUALIZANDO</h2>
    <p class="mid" id="ov-title">NOW LOADING...</p>
    <div class="hp"><i id="ov-bar"></i></div>
    <p class="muted" id="ov-msg">Baixando a nova versao do GitHub. O painel reinicia sozinho.</p>
    <pre class="logs" id="ov-log"></pre>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
</body>
</html>
