<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262b44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VM PANEL">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-180.png">
<meta name="robots" content="noindex, nofollow">
<title>VM//PANEL</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/sprite.svg" type="image/svg+xml">
<script src="/static/pwa.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="hud">
    <h1 class="logo">VM//PANEL<small id="subtitle">LOADING...</small></h1>
    <div class="chips" id="chips"></div>
    <div class="hud-right">
      <button class="btn" id="btn-refresh" title="Atualizar dados agora (R)" aria-label="Atualizar dados">&#8635;<span class="t"> DADOS</span></button>
      <button class="btn gold" id="btn-update" title="Atualizar o painel para a ultima versao" aria-label="Atualizar painel">&#9733;<span class="t"> ATUALIZAR PAINEL</span></button>
      <button class="btn danger" id="btn-logout" title="Sair">SAIR</button>
      <div class="clock"><span id="clock">--:--:--</span><small id="uptime">uptime --</small></div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Secoes"></nav>

  <div id="ptr" class="ptr" aria-hidden="true">&#8635; SOLTE PARA ATUALIZAR</div>
  <main id="view"></main>
</div>

<nav class="bnav" id="bnav" aria-label="Menu"></nav>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="box sheet">
    <div class="grab" id="modal-grab" aria-hidden="true"><i></i></div>
    <h2 id="modal-title">-</h2>
    <div class="toolbar" id="modal-tools"></div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="overlay" class="hidden">
  <div class="box">
    <h2>ATUALIZANDO</h2>
    <p class="mid" id="ov-title">NOW LOADING...</p>
    <div class="hp"><i id="ov-bar"></i></div>
    <p class="muted" id="ov-msg">Baixando a nova versao do GitHub. O painel reinicia sozinho.</p>
    <pre class="logs" id="ov-log"></pre>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
</body>
</html>
